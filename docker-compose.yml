services:
  postgres:
    image: postgres:16
    container_name: idx_postgres
    ports:
      - "${POSTGRESQL_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRESQL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_DB_PASSWORD:?set POSTGRESQL_DB_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRESQL_DB_NAME:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: idx_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: idx_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_INSTALL_PLUGINS: grafana-mongodb-datasource
      GF_SERVER_ROOT_URL: http://localhost:3001
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mlflow:
    build:
      context: ./docker/mlflow
    container_name: idx_mlflow
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - "postgresql+psycopg2://${POSTGRESQL_DB_USER:-postgres}:${POSTGRESQL_DB_PASSWORD}@postgres:5432/${POSTGRESQL_DB_NAME:-postgres}"
      - --artifacts-destination
      - /mlartifacts
    volumes:
      - mlflow_artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  grafana_data:
  postgres_data:
  mongo_data:
  mlflow_artifacts:
